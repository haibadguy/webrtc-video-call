<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebRTC Video Call</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .videos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        video { width: 100%; background: #111; border-radius: 8px; }
        button { margin: 1rem 0.5rem 1rem 0; padding: 0.6rem 1rem; }
        #status { color: #555; }
    </style>
</head>

<body>
    <h1>WebRTC Video Call</h1>
    <p id="status">Connecting to signaling server...</p>
    <div class="videos">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <button id="startCall" disabled>Start call</button>
    <button id="reset">Reset</button>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <script>
        const localVideo = document.getElementById("localVideo");
        const remoteVideo = document.getElementById("remoteVideo");
        const startCallButton = document.getElementById("startCall");
        const resetButton = document.getElementById("reset");

        const socket = io();
        let localStream;
        let pc;
        let peerCount = 0;
        const pendingCandidates = [];

        function showError(message) {
            status.textContent = message;
            status.style.color = "crimson";
        }

        async function preparePeerConnection() {
            pc = new RTCPeerConnection({
                iceServers: [{
                    urls: "stun:stun.l.google.com:19302"
                }]
            });

            pc.ontrack = (event) => {
                if (event.track.kind === "video") {
                    remoteVideo.srcObject = event.streams[0];
                }
            };

            pc.onicecandidate = event => {
                if (event.candidate) {
                    socket.emit("candidate", event.candidate.toJSON());
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log("ICE connection state:", pc.iceConnectionState);
                if (["disconnected", "failed"].includes(pc.iceConnectionState)) {
                    showError("ICE connection state: " + pc.iceConnectionState);
                }
            };

            pc.onconnectionstatechange = () => {
                console.log("Connection state:", pc.connectionState);
                if (["disconnected", "failed"].includes(pc.connectionState)) {
                    showError("Connection state: " + pc.connectionState);
                }
            };

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                localVideo.srcObject = localStream;

                localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
            } catch (error) {
                console.error("Error accessing media devices.", error);
                showError("Error accessing your camera or microphone. Please check permissions.");
            }
        }

        async function startCall() {
            await preparePeerConnection();
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit("offer", pc.localDescription.toJSON());
        }

        const status = document.getElementById("status");

        socket.on("answer", async (data) => {
            try {
                await pc.setRemoteDescription(data);
                while (pendingCandidates.length) {
                    await pc.addIceCandidate(pendingCandidates.shift());
                }
            } catch (error) {
                console.error("Error setting remote description:", error);
                showError("Failed to set remote description.");
            }
        });

        socket.on("candidate", async (data) => {
            try {
                if (!pc || !pc.remoteDescription) {
                    pendingCandidates.push(data);
                    return;
                }
                await pc.addIceCandidate(data);
            } catch (error) {
                console.error("Error adding ICE candidate:", error);
                showError("Failed to add ICE candidate.");
            }
        });

        socket.on("peer-count", ({ count }) => {
            peerCount = count;
            startCallButton.disabled = count !== 2;
            status.textContent = count === 2
                ? "Two peers connected. Start the call in one tab."
                : "Waiting for a second browser tab...";
        });

        socket.on("offer", async offer => {
            if (!pc) {
                await preparePeerConnection();
            }
            await pc.setRemoteDescription(offer);
            while (pendingCandidates.length) {
                await pc.addIceCandidate(pendingCandidates.shift());
            }
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit("answer", pc.localDescription.toJSON());
        });

        socket.on("peer-left", () => {
            if (pc) {
                pc.close();
                pc = null;
            }
            remoteVideo.srcObject = null;
            status.textContent = "The other peer left. Waiting for another peer...";
        });

        socket.on("connect_error", () => {
            showError("Failed to connect to signaling server. Please try again.");
        });

        socket.on("disconnect", () => {
            showError("Disconnected from signaling server. Check your connection.");
        });

        startCallButton.onclick = async () => {
            startCallButton.disabled = true;
            await startCall();
        };

        resetButton.onclick = () => window.location.reload();
    </script>
</body>

</html>
